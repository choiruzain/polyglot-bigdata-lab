x-hadoop: &hadoop
  build: ./images/hadoop
  image: dataplatform/hadoop:local
  profiles: ["bigdata-lite", "bigdata-full"]
  restart: "no"

x-hive: &hive
  build: ./images/hive
  image: dataplatform/hive:local
  profiles: ["bigdata-lite", "bigdata-full"]
  restart: "no"

services:
  metastore-db:
    image: postgres:18.6
    profiles: ["bigdata-lite", "bigdata-full"]
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${METASTORE_DB_PASSWORD:?run scripts/init-env.sh first}
    volumes:
      - metastore-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: "no"

  namenode:
    <<: *hadoop
    hostname: namenode
    command: ["/opt/hadoop/entrypoint.sh", "namenode"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512m
    volumes:
      - namenode-data:/opt/hadoop/data/namenode
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NAMENODE_UI_PORT:-9870}:9870"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9870/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  datanode:
    <<: *hadoop
    hostname: datanode
    command: ["/opt/hadoop/entrypoint.sh", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      HADOOP_HEAPSIZE_MAX: 512m
    volumes:
      - datanode-data:/opt/hadoop/data/datanode
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9864/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  metastore:
    <<: *hive
    hostname: metastore
    command: ["/opt/hive/entrypoint.sh", "metastore"]
    depends_on:
      metastore-db:
        condition: service_healthy
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    environment:
      METASTORE_DB_PASSWORD: ${METASTORE_DB_PASSWORD:?run scripts/init-env.sh first}
      HADOOP_HEAPSIZE_MAX: 768m
    volumes:
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  hiveserver2:
    <<: *hive
    hostname: hiveserver2
    command: ["/opt/hive/entrypoint.sh", "hiveserver2"]
    depends_on:
      metastore:
        condition: service_healthy
    environment:
      HADOOP_HEAPSIZE_MAX: 1536m
      TEZ_HOME: /opt/tez
      HADOOP_CLASSPATH: "/opt/tez/*:/opt/tez/lib/*:/opt/tez/conf"
    volumes:
      - ./config/hive/hive-site-hs2.xml:/opt/hive/conf/hive-site.xml:ro
      - ./config/tez/tez-site.xml:/opt/tez/conf/tez-site.xml:ro
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HIVESERVER2_PORT:-10000}:10000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/10000'"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s

  tools:
    build: ./images/tools
    image: dataplatform/tools:local
    profiles: ["bigdata-lite", "bigdata-full", "sql", "mongo", "cassandra", "neo4j", "clickhouse", "tools"]
    hostname: tools
    init: true
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--notebook-dir=/home/student/notebooks"]
    depends_on:
      metastore:
        condition: service_healthy
        required: false
    environment:
      HADOOP_USER_NAME: student
      HADOOP_CONF_DIR: /opt/hadoop-conf
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?run scripts/init-env.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MONGO_PASSWORD: ${MONGO_STUDENT_PASSWORD:-}
      CASSANDRA_PASSWORD: ${CASSANDRA_STUDENT_PASSWORD:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - ./config/hadoop:/opt/hadoop-conf:ro
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./notebooks:/home/student/notebooks
      - ./data:/home/student/data
      - ./scripts:/home/student/scripts:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${JUPYTER_PORT:-8888}:8888"
      - "${BIND_ADDRESS:-127.0.0.1}:${SPARK_UI_PORT:-4040}:4040"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: "no"

  postgres:
    image: postgres:18.6
    profiles: ["sql"]
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: student
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d shop"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: "no"

  mysql:
    image: mysql:9.7
    profiles: ["sql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run scripts/init-env.sh first}
      MYSQL_DATABASE: shop
      MYSQL_USER: student
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run scripts/init-env.sh first}
    command: ["--innodb-buffer-pool-size=128M"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: "no"

  mongo:
    image: mongo:8.3
    profiles: ["mongo"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?run scripts/init-env.sh first}
      MONGO_STUDENT_PASSWORD: ${MONGO_STUDENT_PASSWORD:?add MONGO_STUDENT_PASSWORD to .env}
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo/init-student.sh:/docker-entrypoint-initdb.d/init-student.sh:ro
      - ./scripts/mongo:/scripts:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: "no"

  cassandra:
    image: cassandra:5.0
    profiles: ["cassandra"]
    entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]
    environment:
      CASSANDRA_CLUSTER_NAME: teaching
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_ROOT_PASSWORD: ${CASSANDRA_ROOT_PASSWORD:?add CASSANDRA_ROOT_PASSWORD to .env}
      CASSANDRA_STUDENT_PASSWORD: ${CASSANDRA_STUDENT_PASSWORD:?add CASSANDRA_STUDENT_PASSWORD to .env}
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./scripts/cassandra:/scripts:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CASSANDRA_PORT:-9042}:9042"
    healthcheck:
      test: ["CMD-SHELL", "nodetool statusbinary | grep -q running"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s
    restart: "no"

  neo4j:
    image: neo4j:2026.07.1
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?run scripts/init-env.sh first}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
      - ./scripts/neo4j:/scripts:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${BIND_ADDRESS:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/7687'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run scripts/init-env.sh first}
      CLICKHOUSE_DB: shop
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ./scripts/clickhouse:/scripts:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${BIND_ADDRESS:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8123'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: "no"

volumes:
  metastore-db-data:
  namenode-data:
  datanode-data:
  postgres-data:
  mysql-data:
  mongo-data:
  cassandra-data:
  neo4j-data:
  clickhouse-data:
