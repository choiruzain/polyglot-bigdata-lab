services:
  metastore-db:
    image: postgres:18.6
    profiles: ["bigdata-lite", "bigdata-full"]
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${METASTORE_DB_PASSWORD:?run scripts/init-env.sh first}
    volumes:
      - metastore-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: "no"

volumes:
  metastore-db-data:
